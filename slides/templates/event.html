<section id="event" data-transition="fade" style="background:#f7f5f0; color:#1c2633; font-family:Montserrat, Verdana, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:row; gap:96px">
  <div style="flex:1; display:flex; flex-direction:column; justify-content:space-between; gap:40px">
    <div style="display:flex; flex-direction:column; gap:28px">
      <div style="display:flex; flex-direction:row; align-items:center; gap:20px">
        <div style="width:20px; height:20px; background:#d57e00; border-radius:50%"></div>
        <p style="font-size:26px; font-weight:700; letter-spacing:4px; text-transform:uppercase; color:#346094">[Series · dates]</p>
      </div>
      <h1 style="font-size:112px; font-weight:700; line-height:1.05; letter-spacing:-2px; color:#1c2633">[Event name]</h1>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px; border-left:6px solid #d57e00; padding:4px 0 4px 32px">
      <p style="font-size:44px; font-weight:600; line-height:1.25">[Day, Month D · time]</p>
      <p style="font-size:40px; font-weight:500; line-height:1.25">[Venue, city]</p>
      <p style="font-size:30px; font-weight:500; line-height:1.3; color:#5a6878">[One line: who it's for, what's covered]</p>
    </div>
  </div>
  <div style="width:400px; display:flex; flex-direction:column; justify-content:flex-end; gap:24px">
    <div style="display:flex; flex-direction:column; align-items:center; gap:20px; background:#ffffff; border:2px solid #e2e6ec; border-radius:16px; padding:36px">
      <div style="width:232px; height:232px; display:flex; align-items:center; justify-content:center; background:#e2e6ec; border:3px dashed #c9d3e0"><p style="font-size:24px; font-weight:500; text-align:center; color:#5a6878">[QR code]</p></div>
      <h3 style="font-size:24px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:#346094">[RSVP]</h3>
    </div>
  </div>
  <div style="position:absolute; right:128px; bottom:48px; width:800px; display:flex; flex-direction:row; align-items:center; justify-content:flex-end; gap:16px">
    <div style="width:56px; height:56px; background:#346094; border-radius:50%; display:flex; align-items:center; justify-content:center"><p style="font-size:24px; font-weight:700; letter-spacing:1px; color:#f7f5f0">AB</p></div>
    <p style="font-size:24px; font-weight:600; letter-spacing:2px; color:#5a6878">[Presenter]</p>
  </div>
  <aside>One event, one slide: what, when, where, and a QR code for the action (RSVP, sign up). The full link goes in these notes, never on the slide.</aside>
</section>
